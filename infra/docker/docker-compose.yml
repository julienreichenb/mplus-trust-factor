services:
  postgres:
    image: postgres:16-alpine
    container_name: mplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mplus_trust
      POSTGRES_USER: mplus
      POSTGRES_PASSWORD: mplus
    ports:
      # Host 5433 avoids conflicts with a local Windows PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - mplus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplus -d mplus_trust"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mplus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mplus_pg_data:
  mplus_redis_data:
