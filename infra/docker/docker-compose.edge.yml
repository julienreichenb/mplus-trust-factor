# Shared edge proxy — the ONLY services that publish host ports (80/443).
# Lives under /opt/mplus/shared/caddy on the VPS.
#
#   docker compose -p mplus-edge \
#     -f infra/docker/docker-compose.edge.yml \
#     --env-file /opt/mplus/shared/caddy/.env \
#     up -d
#
# Creates external network `mplus-proxy` used by mplus-prod and mplus-test.

name: mplus-edge

networks:
  proxy:
    name: mplus-proxy
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      APP_PROD_DOMAIN: ${APP_PROD_DOMAIN:?APP_PROD_DOMAIN is required}
      APP_TEST_DOMAIN: ${APP_TEST_DOMAIN:?APP_TEST_DOMAIN is required}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
