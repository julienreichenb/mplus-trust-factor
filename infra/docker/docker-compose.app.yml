# Shared application stack (no public ports, no Caddy).
# Always invoke with an explicit project name:
#   docker compose -p mplus-prod -f docker-compose.app.yml -f docker-compose.prod.yml --env-file ...
#   docker compose -p mplus-test -f docker-compose.app.yml -f docker-compose.test.yml --env-file ...
#
# Joins external network `mplus-proxy` (created by docker-compose.edge.yml) for Caddy routing.
# Service aliases (mplus-prod-api / mplus-test-api, …) are set in the env-specific override files.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &default-restart unless-stopped

networks:
  app:
    driver: bridge
  proxy:
    external: true
    name: mplus-proxy

volumes:
  postgres_data:
  redis_data:
  raw_artifacts:
  backups:

services:
  web:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/mplus-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: *default-restart
    logging: *default-logging
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    networks:
      - app
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    image: ghcr.io/${GHCR_OWNER}/mplus-api:${IMAGE_TAG}
    restart: *default-restart
    logging: *default-logging
    env_file:
      - ${ENV_FILE:?ENV_FILE must point to the environment .env}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_VERSION: ${IMAGE_TAG}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RAW_ARTIFACTS_DIR: /data/raw-artifacts
      WEB_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      COOKIE_DOMAIN: ${APP_DOMAIN}
    volumes:
      - raw_artifacts:/data/raw-artifacts
    networks:
      - app
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ghcr.io/${GHCR_OWNER}/mplus-worker:${IMAGE_TAG}
    restart: *default-restart
    logging: *default-logging
    env_file:
      - ${ENV_FILE:?ENV_FILE must point to the environment .env}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${IMAGE_TAG}
      WORKER_HEALTH_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RAW_ARTIFACTS_DIR: /data/raw-artifacts
      WEB_ORIGIN: https://${APP_DOMAIN}
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
    volumes:
      - raw_artifacts:/data/raw-artifacts
    networks:
      - app
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  migrate:
    image: ghcr.io/${GHCR_OWNER}/mplus-migrate:${IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # One-shot Ability Catalog source sync (SimC + Blizzard → pending classification).
  # Never activates releases. Not part of normal app deploy.
  #   docker compose -p <stack> -f docker-compose.app.yml -f docker-compose.<env>.yml \
  #     --env-file <env> --profile catalog-sync run --rm catalog-sync
  catalog-sync:
    image: ghcr.io/${GHCR_OWNER}/mplus-catalog-sync:${IMAGE_TAG}
    profiles: ["catalog-sync"]
    env_file:
      - ${ENV_FILE:?ENV_FILE must point to the environment .env}
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ABILITY_CATALOG_SIMC_BIN: /usr/local/bin/simc
      RAW_ARTIFACTS_DIR: /data/raw-artifacts
    volumes:
      - raw_artifacts:/data/raw-artifacts
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/backups
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    # No host ports — app network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: *default-restart
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
