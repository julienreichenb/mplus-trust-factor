name: Apply refresh trigger rework

on:
  push:
    branches:
      - rework-score-refresh-triggers
    paths:
      - tools/scripts/apply-refresh-trigger-rework.mjs
      - .github/workflows/apply-refresh-trigger-rework.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rework-score-refresh-triggers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patches
        run: node tools/scripts/apply-refresh-trigger-rework.mjs
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/character-service.ts \
                  apps/api/src/services/admin-service.ts \
                  apps/api/src/services/admin-score-context-service.ts \
                  apps/api/src/routes/admin-score-context.ts \
                  apps/web/src/pages/AdminScoreContextPage.vue \
                  apps/web/src/pages/CharacterPage.vue
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "refactor(refresh): remove implicit recalculation triggers"
          git push origin HEAD:rework-score-refresh-triggers
