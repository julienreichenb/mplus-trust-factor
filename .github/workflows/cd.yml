name: CD

# Promotion release pipeline.
#
# Policy:
#   - push to `test` → verify SHA ∈ main → quality gate → build/push SHA images →
#                     secret scan → deploy test → ready/revision verify
#   - push to `prod` → verify SHA ∈ test → verify GHCR images exist (no rebuild) →
#                     deploy production
#   - workflow_dispatch → same rules; production only from `refs/heads/prod`;
#                         skip_deploy builds/verifies without VPS deploy
#   - No feature-branch deploys; no mutable tags; score-model activation is NOT CD
#
# GitHub Environments: `test` | `production` (separate secrets/variables).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target (GitHub Environment + VPS stack)
        required: true
        type: choice
        options:
          - test
          - production
        default: test
      image_tag:
        description: Immutable image tag (git SHA). Empty = workflow commit SHA.
        required: false
        type: string
        default: ""
      skip_deploy:
        description: Build/verify only (no VPS deploy)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - test
      - prod

concurrency:
  # Isolate locks per target so test never cancels an in-progress production deploy.
  group: >-
    cd-${{
      github.event.inputs.environment
      || (github.ref == 'refs/heads/prod' && 'production')
      || 'test'
    }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' && github.event.inputs.environment != 'production' }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"
  PROVIDER_MODE: fixture
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgresql://mplus:mplus@localhost:5432/mplus_trust?schema=public
  REDIS_URL: redis://localhost:6379
  WEB_ORIGIN: http://localhost:5173
  PUBLIC_BASE_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-at-least-32-chars!!
  ADMIN_API_KEY: ci-admin-key
  ALLOW_LIVE_PROVIDER_CALLS: "false"

jobs:
  policy:
    name: Deployment policy
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      script_env: ${{ steps.map.outputs.script_env }}
      should_deploy: ${{ steps.map.outputs.should_deploy }}
      image_tag: ${{ steps.map.outputs.image_tag }}
      needs_build: ${{ steps.map.outputs.needs_build }}
      ancestry_ref: ${{ steps.map.outputs.ancestry_ref }}
    steps:
      - name: Map target and enforce branch policy
        id: map
        run: |
          set -euo pipefail

          RAW="${{ github.event.inputs.environment || '' }}"
          SHOULD_DEPLOY="true"
          NEEDS_BUILD="true"
          ANCESTRY_REF="origin/main"

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
              RAW="production"
            elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
              RAW="test"
            else
              echo "::error::Unexpected push ref ${{ github.ref }}"
              exit 1
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_deploy }}" = "true" ]; then
            SHOULD_DEPLOY="false"
          fi

          case "${RAW}" in
            production|prod)
              echo "deploy_env=production" >> "${GITHUB_OUTPUT}"
              echo "script_env=prod" >> "${GITHUB_OUTPUT}"
              NEEDS_BUILD="false"
              ANCESTRY_REF="origin/test"
              if [ "${{ github.ref }}" != "refs/heads/prod" ]; then
                echo "::error::production deploy refused: ref must be refs/heads/prod (got ${{ github.ref }})"
                exit 1
              fi
              ;;
            test)
              echo "deploy_env=test" >> "${GITHUB_OUTPUT}"
              echo "script_env=test" >> "${GITHUB_OUTPUT}"
              NEEDS_BUILD="true"
              ANCESTRY_REF="origin/main"
              if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/test" ]; then
                echo "::error::test push deploy refused: expected refs/heads/test"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown environment: ${RAW}"
              exit 1
              ;;
          esac

          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_SHA}"; fi
          if [ "${TAG}" = "latest" ]; then
            echo "::error::refusing mutable tag latest"
            exit 1
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "needs_build=${NEEDS_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "ancestry_ref=${ANCESTRY_REF}" >> "${GITHUB_OUTPUT}"
          echo "Mapped deploy_env=${RAW} should_deploy=${SHOULD_DEPLOY} needs_build=${NEEDS_BUILD} image_tag=${TAG}"

  verify-promotion:
    name: Verify promotion ancestry
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail unless SHA is in required branch history
        run: |
          set -euo pipefail
          TAG="${{ needs.policy.outputs.image_tag }}"
          ANCESTRY_REF="${{ needs.policy.outputs.ancestry_ref }}"
          BRANCH_NAME="${ANCESTRY_REF#origin/}"

          git fetch --prune origin "${BRANCH_NAME}"
          if ! git rev-parse --verify "${ANCESTRY_REF}^{commit}" >/dev/null 2>&1; then
            echo "::error::Missing ${ANCESTRY_REF} after fetch"
            exit 1
          fi

          if ! git cat-file -e "${TAG}^{commit}" 2>/dev/null; then
            git fetch --prune origin "${TAG}" || true
          fi
          if ! git cat-file -e "${TAG}^{commit}" 2>/dev/null; then
            echo "::error::Commit ${TAG} is not resolvable in this repository"
            exit 1
          fi

          if ! git merge-base --is-ancestor "${TAG}" "${ANCESTRY_REF}"; then
            echo "::error::Refusing promotion: ${TAG} is not an ancestor of ${ANCESTRY_REF}"
            exit 1
          fi
          echo "OK: ${TAG} is contained in ${ANCESTRY_REF}"

  quality:
    name: Release quality gate
    needs: [policy, verify-promotion]
    if: needs.policy.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mplus_trust
          POSTGRES_USER: mplus
          POSTGRES_PASSWORD: mplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mplus -d mplus_trust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout promoted SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.image_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Format check (infra + workflows)
        run: pnpm exec prettier --check "infra/**/*.{yml,yaml,mjs}" ".github/**/*.{yml,yaml}" ".prettierrc.json" "package.json"

      - name: ShellCheck deploy scripts
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src koalaman/shellcheck:v0.10.0 \
            -x -e SC1091 \
            infra/scripts/deploy.sh \
            infra/scripts/rollback.sh \
            infra/scripts/validate-env.sh \
            infra/scripts/validate-dual-env.sh \
            infra/scripts/smoke-deploy.sh \
            infra/scripts/health-wait.sh \
            infra/scripts/set-image-tag.sh \
            infra/scripts/generate-secrets.sh \
            infra/scripts/backup-postgres.sh

      - name: Validate dual-env deploy dry-run
        run: bash infra/scripts/validate-dual-env.sh

      - name: Validate nginx configuration
        run: docker run --rm -v "$PWD/infra/docker/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate migrations (empty DB)
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Unit / package tests
        run: pnpm test

      - name: Frontend English-only copy
        run: pnpm check:english

      - name: Abilities validate
        run: pnpm abilities:validate

  build-and-push:
    name: Build & push GHCR images
    needs: [policy, verify-promotion, quality]
    if: needs.policy.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Checkout promoted SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.image_tag }}

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ needs.policy.outputs.image_tag }}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-api:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=mplus-api
          cache-to: type=gha,mode=max,scope=mplus-api
          provenance: true
          sbom: true

      - name: Push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-worker:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=mplus-worker
          cache-to: type=gha,mode=max,scope=mplus-worker
          provenance: true
          sbom: true

      - name: Push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-migrate:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=mplus-migrate
          cache-to: type=gha,mode=max,scope=mplus-migrate
          provenance: true
          sbom: true

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-web:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ steps.meta.outputs.tag }}
            VITE_API_MODE=live
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=mplus-web
          cache-to: type=gha,mode=max,scope=mplus-web
          provenance: true
          sbom: true

      - name: Secret bake scan (images must not contain .env)
        run: |
          set -euo pipefail
          OWNER="${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          for name in mplus-api mplus-worker mplus-web; do
            img="${{ env.REGISTRY }}/${OWNER}/${name}:${TAG}"
            echo "scanning ${img}"
            docker pull "${img}"
            hits="$(docker run --rm --entrypoint sh "${img}" -c 'find /app /usr/share/nginx/html -name ".env" -o -name ".env.production" 2>/dev/null' || true)"
            if [ -n "${hits}" ]; then
              echo "ERROR: env file found in ${img}:" >&2
              echo "${hits}" >&2
              exit 1
            fi
            secret_hits="$(docker run --rm --entrypoint sh "${img}" -c 'grep -R "BLIZZARD_CLIENT_SECRET=" /app 2>/dev/null | head -n 5' || true)"
            if [ -n "${secret_hits}" ]; then
              echo "ERROR: possible baked secret in ${img}" >&2
              exit 1
            fi
          done
          echo "secret bake scan passed"

      - name: Release manifesto
        run: |
          cat > release-manifest.json <<EOF
          {
            "gitSha": "${{ steps.meta.outputs.tag }}",
            "imageTag": "${{ steps.meta.outputs.tag }}",
            "target": "${{ needs.policy.outputs.deploy_env }}",
            "images": {
              "api": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-api:${{ steps.meta.outputs.tag }}",
              "worker": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-worker:${{ steps.meta.outputs.tag }}",
              "web": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-web:${{ steps.meta.outputs.tag }}",
              "migrate": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-migrate:${{ steps.meta.outputs.tag }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.policy.outputs.deploy_env }}-${{ steps.meta.outputs.tag }}
          path: release-manifest.json
          retention-days: 30

  verify-images:
    name: Verify existing GHCR images
    needs: [policy, verify-promotion]
    if: needs.policy.outputs.needs_build == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ needs.policy.outputs.image_tag }}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail closed unless all four SHA images exist
        run: |
          set -euo pipefail
          OWNER="${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          missing=()
          for name in mplus-api mplus-worker mplus-migrate mplus-web; do
            img="${{ env.REGISTRY }}/${OWNER}/${name}:${TAG}"
            if ! docker manifest inspect "${img}" >/dev/null 2>&1; then
              missing+=("${img}")
            else
              echo "found ${img}"
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production images (do not rebuild on prod):"
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All four SHA-tagged images present in GHCR"

      - name: Release manifesto (existing images)
        run: |
          cat > release-manifest.json <<EOF
          {
            "gitSha": "${{ steps.meta.outputs.tag }}",
            "imageTag": "${{ steps.meta.outputs.tag }}",
            "target": "${{ needs.policy.outputs.deploy_env }}",
            "images": {
              "api": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-api:${{ steps.meta.outputs.tag }}",
              "worker": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-worker:${{ steps.meta.outputs.tag }}",
              "web": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-web:${{ steps.meta.outputs.tag }}",
              "migrate": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-migrate:${{ steps.meta.outputs.tag }}"
            },
            "rebuilt": false
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.policy.outputs.deploy_env }}-${{ steps.meta.outputs.tag }}
          path: release-manifest.json
          retention-days: 30

  deploy:
    name: Deploy (${{ needs.policy.outputs.deploy_env }})
    needs: [policy, verify-promotion, quality, build-and-push, verify-images]
    if: |
      always()
      && !cancelled()
      && needs.policy.result == 'success'
      && needs.verify-promotion.result == 'success'
      && needs.policy.outputs.should_deploy == 'true'
      && (
        (
          needs.policy.outputs.needs_build == 'true'
          && needs.quality.result == 'success'
          && needs.build-and-push.result == 'success'
        )
        || (
          needs.policy.outputs.needs_build == 'false'
          && needs.verify-images.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.policy.outputs.deploy_env }}
    env:
      IMAGE_TAG: ${{ needs.policy.outputs.needs_build == 'true' && needs.build-and-push.outputs.image_tag || needs.verify-images.outputs.image_tag }}
      GHCR_OWNER: ${{ needs.policy.outputs.needs_build == 'true' && needs.build-and-push.outputs.owner || needs.verify-images.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.image_tag }}

      - name: Policy checks (Environment variables)
        env:
          REQUIRE_WORKFLOW_DISPATCH: ${{ vars.REQUIRE_WORKFLOW_DISPATCH }}
          ALLOWED_REF_PREFIX: ${{ vars.ALLOWED_REF_PREFIX }}
        run: |
          set -euo pipefail
          if [ "${REQUIRE_WORKFLOW_DISPATCH:-}" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Environment ${{ needs.policy.outputs.deploy_env }} requires workflow_dispatch"
            exit 1
          fi
          if [ -n "${ALLOWED_REF_PREFIX:-}" ]; then
            case "${{ github.ref }}" in
              ${ALLOWED_REF_PREFIX}*) ;;
              *)
                echo "::error::ref ${{ github.ref }} not allowed (need prefix ${ALLOWED_REF_PREFIX})"
                exit 1
                ;;
            esac
          fi
          # Recommended Environment configuration (configure in GitHub UI):
          #   test:       ALLOWED_REF_PREFIX=refs/heads/test
          #   production: ALLOWED_REF_PREFIX=refs/heads/prod
          #               Required reviewers enabled on the Environment

      - name: Require deploy secrets (fail-closed)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PUBLIC_URL: ${{ secrets.VPS_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SSH_HOST}" ] || missing+=(VPS_SSH_HOST)
          [ -n "${SSH_USER}" ] || missing+=(VPS_SSH_USER)
          [ -n "${SSH_KEY}" ] || missing+=(VPS_SSH_KEY)
          [ -n "${PUBLIC_URL}" ] || missing+=(VPS_PUBLIC_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deploy secrets for environment ${{ needs.policy.outputs.deploy_env }}: ${missing[*]}"
            echo "::error::Configure GitHub Environment secrets — refusing green no-op."
            exit 1
          fi
          echo "Deploy secrets present for ${{ needs.policy.outputs.deploy_env }} (values not logged)"

      - name: SSH deploy (environment-scoped)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Do not enable debug — avoids secret leakage into logs
          script_stop: true
          envs: IMAGE_TAG,SCRIPT_ENV,EXPECTED_SHA,GHCR_OWNER,MPLUS_ROOT,REPO_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            # Never enable xtrace — secrets and tokens must not enter logs
            if [ -z "${MPLUS_ROOT:-}" ]; then MPLUS_ROOT=/opt/mplus; fi
            if [ -z "${REPO_DIR:-}" ]; then REPO_DIR=/opt/mplus/repo; fi
            ENV_FILE="${MPLUS_ROOT}/${SCRIPT_ENV}/.env"
            cd "${REPO_DIR}"

            echo "[cd] fetching ${EXPECTED_SHA}"
            git fetch --prune origin
            # Exact immutable SHA only — never fall back to pull / branch tip
            if ! git rev-parse --verify "${EXPECTED_SHA}^{commit}" >/dev/null 2>&1; then
              echo "[cd] ERROR: SHA ${EXPECTED_SHA} not found after fetch" >&2
              exit 1
            fi
            git checkout --detach "${EXPECTED_SHA}"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "${HEAD_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "[cd] ERROR: detached HEAD ${HEAD_SHA} != expected ${EXPECTED_SHA}" >&2
              exit 1
            fi

            echo "[cd] GHCR login"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            chmod +x infra/scripts/*.sh
            export MPLUS_ROOT IMAGE_TAG GHCR_OWNER
            export STRICT_SECRETS=1

            echo "[cd] set IMAGE_TAG=${IMAGE_TAG} in ${ENV_FILE}"
            ./infra/scripts/set-image-tag.sh "${ENV_FILE}" "${IMAGE_TAG}"

            echo "[cd] validate env before touching stack"
            ./infra/scripts/validate-env.sh "${SCRIPT_ENV}"

            echo "[cd] deploy ${SCRIPT_ENV}"
            ./infra/scripts/deploy.sh "${SCRIPT_ENV}"
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SCRIPT_ENV: ${{ needs.policy.outputs.script_env }}
          EXPECTED_SHA: ${{ needs.policy.outputs.image_tag }}
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
          MPLUS_ROOT: ${{ secrets.VPS_MPLUS_ROOT }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Health + revision verify (fail-closed)
        env:
          PUBLIC_URL: ${{ secrets.VPS_PUBLIC_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          chmod +x infra/scripts/health-wait.sh infra/scripts/smoke-deploy.sh
          BASE="${PUBLIC_URL%/}"
          echo "Verifying ${BASE}/health/ready and revision ${IMAGE_TAG}"
          ./infra/scripts/health-wait.sh "${BASE}/health/ready" 180
          ./infra/scripts/health-wait.sh "${BASE}/api/v1/meta" 60 \
            --expect-json-field version "${IMAGE_TAG}"
          echo "Deploy verification PASSED"

      - name: Release summary
        if: always()
        run: |
          cat <<EOF
          ## Release summary
          - outcome: ${{ job.status }}
          - github environment: ${{ needs.policy.outputs.deploy_env }}
          - vps script target: ${{ needs.policy.outputs.script_env }}
          - compose project: mplus-${{ needs.policy.outputs.script_env }}
          - imageTag: ${{ env.IMAGE_TAG }}
          - gitSha: ${{ needs.policy.outputs.image_tag }}
          - rebuilt: ${{ needs.policy.outputs.needs_build }}
          - rollback: ./infra/scripts/rollback.sh ${{ needs.policy.outputs.script_env }} <previous-sha>
          - model activation: admin/DB only — CD does not flip ACTIVE_SCORE_MODEL_*
          EOF
