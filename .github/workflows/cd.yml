name: CD

# Builds immutable SHA images to GHCR, then deploys the matching environment.
#
# Policy (programme intent):
#   - push to `main`  → build + deploy **test** (fail-closed if secrets missing)
#   - push to `prod`  → build + deploy **production** (prepared; activate only when
#                       the `prod` branch exists and GitHub Environment protection
#                       + required reviewers are configured — do not use until test is clean)
#   - workflow_dispatch → build + optional deploy; production only from `refs/heads/prod`
#   - No feature-branch production deploys
#   - Score-model activation is NOT a CD concern (DB/admin only)
#
# GitHub Environments: `test` | `production` (separate secrets/variables).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target (GitHub Environment + VPS stack)
        required: true
        type: choice
        options:
          - test
          - production
        default: test
      image_tag:
        description: Immutable image tag (git SHA). Empty = workflow commit SHA.
        required: false
        type: string
        default: ""
      skip_deploy:
        description: Build/push only (no VPS deploy)
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - prod
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**.md"

concurrency:
  # Isolate locks per target so test never cancels an in-progress production deploy.
  group: >-
    cd-${{
      github.event.inputs.environment
      || (github.ref == 'refs/heads/prod' && 'production')
      || 'test'
    }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' && github.event.inputs.environment != 'production' }}

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  policy:
    name: Deployment policy
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      script_env: ${{ steps.map.outputs.script_env }}
      should_deploy: ${{ steps.map.outputs.should_deploy }}
      image_tag: ${{ steps.map.outputs.image_tag }}
    steps:
      - name: Map target and enforce branch policy
        id: map
        run: |
          set -euo pipefail

          RAW="${{ github.event.inputs.environment || '' }}"
          SHOULD_DEPLOY="true"

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
              RAW="production"
            else
              RAW="test"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_deploy }}" = "true" ]; then
            SHOULD_DEPLOY="false"
          fi

          case "${RAW}" in
            production|prod)
              echo "deploy_env=production" >> "${GITHUB_OUTPUT}"
              echo "script_env=prod" >> "${GITHUB_OUTPUT}"
              # Production only from the prod branch (push or dispatch on that ref).
              if [ "${{ github.ref }}" != "refs/heads/prod" ]; then
                echo "::error::production deploy refused: ref must be refs/heads/prod (got ${{ github.ref }})"
                exit 1
              fi
              ;;
            test)
              echo "deploy_env=test" >> "${GITHUB_OUTPUT}"
              echo "script_env=test" >> "${GITHUB_OUTPUT}"
              # Automatic test deploys only from main (dispatch may use any ref for rebuilds).
              if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
                echo "::error::test push deploy refused: expected refs/heads/main"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown environment: ${RAW}"
              exit 1
              ;;
          esac

          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_SHA}"; fi
          if [ "${TAG}" = "latest" ]; then
            echo "::error::refusing mutable tag latest"
            exit 1
          fi

          echo "should_deploy=${SHOULD_DEPLOY}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Mapped deploy_env=${RAW} should_deploy=${SHOULD_DEPLOY} image_tag=${TAG}"

  build-and-push:
    name: Build & push GHCR images
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ needs.policy.outputs.image_tag }}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-api:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=mplus-api
          cache-to: type=gha,mode=max,scope=mplus-api
          provenance: true
          sbom: true

      - name: Push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-worker:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=mplus-worker
          cache-to: type=gha,mode=max,scope=mplus-worker
          provenance: true
          sbom: true

      - name: Push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-migrate:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=mplus-migrate
          cache-to: type=gha,mode=max,scope=mplus-migrate
          provenance: true
          sbom: true

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-web:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
            VITE_API_MODE=live
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=mplus-web
          cache-to: type=gha,mode=max,scope=mplus-web
          provenance: true
          sbom: true

      - name: Release manifesto
        run: |
          cat > release-manifest.json <<EOF
          {
            "gitSha": "${{ github.sha }}",
            "imageTag": "${{ steps.meta.outputs.tag }}",
            "target": "${{ needs.policy.outputs.deploy_env }}",
            "images": {
              "api": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-api:${{ steps.meta.outputs.tag }}",
              "worker": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-worker:${{ steps.meta.outputs.tag }}",
              "web": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-web:${{ steps.meta.outputs.tag }}",
              "migrate": "${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/mplus-migrate:${{ steps.meta.outputs.tag }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.policy.outputs.deploy_env }}-${{ steps.meta.outputs.tag }}
          path: release-manifest.json
          retention-days: 30

  deploy:
    name: Deploy (${{ needs.policy.outputs.deploy_env }})
    needs: [policy, build-and-push]
    if: needs.policy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.policy.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Policy checks (Environment variables)
        env:
          REQUIRE_WORKFLOW_DISPATCH: ${{ vars.REQUIRE_WORKFLOW_DISPATCH }}
          ALLOWED_REF_PREFIX: ${{ vars.ALLOWED_REF_PREFIX }}
        run: |
          set -euo pipefail
          if [ "${REQUIRE_WORKFLOW_DISPATCH:-}" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Environment ${{ needs.policy.outputs.deploy_env }} requires workflow_dispatch"
            exit 1
          fi
          if [ -n "${ALLOWED_REF_PREFIX:-}" ]; then
            case "${{ github.ref }}" in
              ${ALLOWED_REF_PREFIX}*) ;;
              *)
                echo "::error::ref ${{ github.ref }} not allowed (need prefix ${ALLOWED_REF_PREFIX})"
                exit 1
                ;;
            esac
          fi
          # Recommended Environment configuration (configure in GitHub UI — not activated here):
          #   test:       ALLOWED_REF_PREFIX=refs/heads/main
          #   production: ALLOWED_REF_PREFIX=refs/heads/prod
          #               REQUIRE_WORKFLOW_DISPATCH=true (optional extra gate)
          #               Required reviewers enabled on the Environment

      - name: Require deploy secrets (fail-closed)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PUBLIC_URL: ${{ secrets.VPS_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SSH_HOST}" ] || missing+=(VPS_SSH_HOST)
          [ -n "${SSH_USER}" ] || missing+=(VPS_SSH_USER)
          [ -n "${SSH_KEY}" ] || missing+=(VPS_SSH_KEY)
          [ -n "${PUBLIC_URL}" ] || missing+=(VPS_PUBLIC_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required deploy secrets for environment ${{ needs.policy.outputs.deploy_env }}: ${missing[*]}"
            echo "::error::Configure GitHub Environment secrets — refusing green no-op."
            exit 1
          fi
          echo "Deploy secrets present for ${{ needs.policy.outputs.deploy_env }} (values not logged)"

      - name: SSH deploy (environment-scoped)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Do not enable debug — avoids secret leakage into logs
          script_stop: true
          envs: IMAGE_TAG,SCRIPT_ENV,EXPECTED_SHA,GHCR_OWNER,MPLUS_ROOT,REPO_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            # Never enable xtrace — secrets and tokens must not enter logs
            if [ -z "${MPLUS_ROOT:-}" ]; then MPLUS_ROOT=/opt/mplus; fi
            if [ -z "${REPO_DIR:-}" ]; then REPO_DIR=/opt/mplus/repo; fi
            ENV_FILE="${MPLUS_ROOT}/${SCRIPT_ENV}/.env"
            cd "${REPO_DIR}"

            echo "[cd] fetching ${EXPECTED_SHA}"
            git fetch --prune origin
            # Exact immutable SHA only — never fall back to pull / branch tip
            if ! git rev-parse --verify "${EXPECTED_SHA}^{commit}" >/dev/null 2>&1; then
              echo "[cd] ERROR: SHA ${EXPECTED_SHA} not found after fetch" >&2
              exit 1
            fi
            git checkout --detach "${EXPECTED_SHA}"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "${HEAD_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "[cd] ERROR: detached HEAD ${HEAD_SHA} != expected ${EXPECTED_SHA}" >&2
              exit 1
            fi

            echo "[cd] GHCR login"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            chmod +x infra/scripts/*.sh
            export MPLUS_ROOT IMAGE_TAG GHCR_OWNER
            export STRICT_SECRETS=1

            echo "[cd] set IMAGE_TAG=${IMAGE_TAG} in ${ENV_FILE}"
            ./infra/scripts/set-image-tag.sh "${ENV_FILE}" "${IMAGE_TAG}"

            echo "[cd] validate env before touching stack"
            ./infra/scripts/validate-env.sh "${SCRIPT_ENV}"

            echo "[cd] deploy ${SCRIPT_ENV}"
            ./infra/scripts/deploy.sh "${SCRIPT_ENV}"
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          SCRIPT_ENV: ${{ needs.policy.outputs.script_env }}
          EXPECTED_SHA: ${{ github.sha }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.owner }}
          MPLUS_ROOT: ${{ secrets.VPS_MPLUS_ROOT }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Health + revision verify (fail-closed)
        env:
          PUBLIC_URL: ${{ secrets.VPS_PUBLIC_URL }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x infra/scripts/health-wait.sh infra/scripts/smoke-deploy.sh
          BASE="${PUBLIC_URL%/}"
          echo "Verifying ${BASE}/health/ready and revision ${IMAGE_TAG}"
          ./infra/scripts/health-wait.sh "${BASE}/health/ready" 180
          ./infra/scripts/health-wait.sh "${BASE}/api/v1/meta" 60 \
            --expect-json-field version "${IMAGE_TAG}"
          echo "Deploy verification PASSED"

      - name: Release summary
        if: always()
        run: |
          cat <<EOF
          ## Release summary
          - outcome: ${{ job.status }}
          - github environment: ${{ needs.policy.outputs.deploy_env }}
          - vps script target: ${{ needs.policy.outputs.script_env }}
          - compose project: mplus-${{ needs.policy.outputs.script_env }}
          - imageTag: ${{ needs.build-and-push.outputs.image_tag }}
          - gitSha: ${{ github.sha }}
          - rollback: ./infra/scripts/rollback.sh ${{ needs.policy.outputs.script_env }} <previous-sha>
          - model activation: admin/DB only — CD does not flip ACTIVE_SCORE_MODEL_*
          EOF
