name: Fix refresh rework build

on:
  push:
    branches: [rework-score-refresh-triggers]
    paths: [.github/workflows/fix-refresh-rework-build.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rework-score-refresh-triggers
      - name: Restore explicit admin recalc dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/services/admin-service.ts')
          s = p.read_text()
          old = 'import { ScoreModelDraftInUseError } from "@mplus/worker";'
          new = 'import { requireEffectiveScoringSeasonRow, ScoreModelDraftInUseError } from "@mplus/worker";'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-refresh-rework-build.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/services/admin-service.ts
          git commit -m "fix(api): keep explicit admin score recalculation"
          git push origin HEAD:rework-score-refresh-triggers
